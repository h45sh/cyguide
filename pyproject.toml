[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cyguide"
version = "1.7.0"
authors = [
  { name="Harshwardhan Patil" },
  { name="CyGuide Contributors" },
]
description = "A TUI-based guided cybersecurity learning platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Intended Audience :: Education",
]
dependencies = [
    "textual>=1.0.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyperclip>=1.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[project.urls]
Homepage = "https://github.com/h45sh/cyguide"
Repository = "https://github.com/h45sh/cyguide"
Issues = "https://github.com/h45sh/cyguide/issues"

[tool.setuptools.packages.find]
include = ["cyguide*", "tools*"]

[tool.setuptools.package-data]
cyguide = ["ui/style.css"]
tools = ["*/*.toml", "*/*.txt"]

[project.scripts]
cyg = "cyguide.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".venv", "venv", ".git", "__pycache__"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E9",   # Runtime syntax errors
    "F63",  # Assertions and test syntax
    "F7",   # Fatal syntax errors
    "F82",  # Undefined names and variable lookup failures
]

[tool.ruff.lint.isort]
known-first-party = ["cyguide", "tools"]

