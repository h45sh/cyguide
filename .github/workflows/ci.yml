name: CI

on:
  push:
    branches: [ "main", "dev" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"
  pull_request:
    branches: [ "main", "dev" ]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Dependency Vulnerability Audit
        run: pip-audit
        continue-on-error: true

      - name: Verify Schema Registry Documentation Sync
        run: python3 scripts/generate_schema_registry.py --check

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies and build wheel package
        run: |
          python -m pip install --upgrade pip setuptools build
          pip install -r requirements.txt -r requirements-dev.txt
          python -m build --wheel
          pip install dist/*.whl

      - name: Run verification pipeline (test suite & schema registry)
        run: |
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh

      - name: Run diagnostic health check
        run: |
          cyg doctor --json

  benchmark:
    name: Performance Limits & Regression Guard (Ubuntu)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Performance Benchmark & Regression Check
        run: |
          python3 scripts/generate_benchmark_report.py --check
