name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  lint:
    name: Code Quality & Schema Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Dependency Vulnerability Audit
        run: pip-audit

      - name: Verify Schema Registry Documentation Sync
        run: python3 scripts/generate_schema_registry.py --check

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Run verification pipeline (test suite & schema registry)
        run: |
          chmod +x ./scripts/verify.sh
          ./scripts/verify.sh

      - name: Run diagnostic health check
        run: |
          cyg check --json
